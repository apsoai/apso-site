# Production stack. Secrets are not stored here: index.ts reads them from the environment that
# scripts/with-secrets.sh fills from 1Password. See infra/README.md.
config:
  # Required, left unset until the Cloudflare account exists:
  #   pulumi config set apso-site:accountId <id>
  #   pulumi config set apso-site:workersDevSubdomain <account workers.dev subdomain>
  # Phase 3 only: set to true at the cutover to put the Worker on apso.ai and turn on the www redirect.
  apso-site:serveApex: "false"
